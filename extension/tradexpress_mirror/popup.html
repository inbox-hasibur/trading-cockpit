<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TradeXpress Mirror</title>
  <style>
    :root {
      --bg: #0d131a;
      --card-bg: #141c26;
      --border: #222f3e;
      --text: #e2e8f0;
      --muted: #8899a6;
      --teal: #10b981;
      --red: #ef4444;
      --amber: #f59e0b;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 280px;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12px;
      background: var(--bg);
      color: var(--text);
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.3px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 7px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #64748b;
    }
    .dot.live { background: var(--teal); box-shadow: 0 0 8px rgba(16, 185, 129, 0.6); }
    .dot.offline { background: var(--red); box-shadow: 0 0 8px rgba(239, 68, 68, 0.6); }
    .dot.idle { background: #94a3b8; }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card-bg);
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      margin-bottom: 10px;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #334155;
      transition: .2s;
      border-radius: 20px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .2s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: var(--teal);
    }
    input:checked + .slider:before {
      transform: translateX(16px);
    }

    .telemetry-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      margin-bottom: 10px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .row:last-child {
      margin-bottom: 0;
    }
    .label {
      color: var(--muted);
    }
    .val {
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .footer-badge {
      display: block;
      text-align: center;
      font-size: 10px;
      color: #10b981;
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.2);
      border-radius: 4px;
      padding: 5px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <span>🐦</span>
      <span>Humming Bird</span>
    </div>
    <div class="status-badge" id="status-pill">
      <span class="dot idle" id="status-dot"></span>
      <span id="status-text">Checking…</span>
    </div>
  </div>

  <div class="toggle-row">
    <span>Passive Mirror</span>
    <label class="switch">
      <input type="checkbox" id="mirror-toggle" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="telemetry-card">
    <div class="row">
      <span class="label">Cockpit Target</span>
      <span class="val">127.0.0.1:8000</span>
    </div>
    <div class="row">
      <span class="label">Active Tab</span>
      <span class="val" id="active-tab">—</span>
    </div>
    <div class="row">
      <span class="label">DSE Status</span>
      <span class="val" id="dse-status">—</span>
    </div>
    <div class="row">
      <span class="label">Rows Synced</span>
      <span class="val" id="rows-sent">0</span>
    </div>
    <div class="row">
      <span class="label">Last Sync</span>
      <span class="val" id="last-sync">—</span>
    </div>
  </div>

  <div class="footer-badge">
    100% Read-Only · 0 Broker Requests
  </div>

  <script src="popup.js"></script>
</body>
</html>
